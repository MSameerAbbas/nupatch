[package]
name = "nupatch"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "Patch Cursor IDE to use Nushell instead of PowerShell on Windows"
repository = "https://github.com/MSameerAbbas/nupatch"

[dependencies]
# CLI
clap = { version = "4.6.6", features = ["derive"] }
# Errors
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.20"
# Rendering
tabled = { version = "0.21.0", features = ["ansi"] }
owo-colors = "4.4.0"
anstream = "1.0.0"
terminal_size = "0.4.4"
indicatif = "0.18.6"
inquire = "0.9.4"
# Patching / data
fancy-regex = "0.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
base64 = "0.23.1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
insta = "1.48.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
